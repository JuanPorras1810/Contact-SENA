<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact SENA: plataforma segura para gestionar clientes, campañas e interacciones de contact center.">
    <meta name="robots" content="noindex, nofollow">
    <title>Iniciar sesión | Contact SENA</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/validaciones.js" defer></script>
    <script src="js/modules/index.js" defer></script>
</head>
<body id="body-login">
    <div class="login-card">
        <div class="logo-container">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12v7c0 1.1.9 2 2 2h3v-8H4v-1c0-4.41 3.59-8 8-8s8 3.59 8 8v1h-3v8h3c1.1 0 2-.9 2-2v-7c0-5.52-4.42-10-10-10z"/>
            </svg>
        </div>
        <h1><span class="title-contact">Contact</span> <span class="title-sena">SENA</span></h1>
        <div class="subtitle">Plataforma para gestiones de contact center</div>

        <div class="tab-system">
            <label class="tab-label">
                <input type="radio" id="radio-supervisor" name="user-type" checked>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm0 13c-2.7 0-5.15-1.57-6.28-4 .03-2.07 4.19-3.2 6.28-3.2 2.08 0 6.25 1.13 6.28 3.2-1.13 2.43-3.58 4-6.28 4z"/></svg>
                Supervisor
            </label>
            <label class="tab-label">
                <input type="radio" id="radio-agente" name="user-type">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Agente
            </label>
        </div>

        <!-- Formulario -->
            <form class="form-container" id="login-form" method="POST" autocomplete="off">
            <div class="input-group">
                <label for="login-id">
                    <span>Usuario</span>
                </label>
                <div class="input-img">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                     <input type="text" id="login-id" autocomplete="off" placeholder="Ingresa tu número de identificación" required>
                </div>
            </div>
            <div class="input-group">
                <label for="login-password">
                    <span >Contraseña</span>
                </label>
                <div class="input-img">
                    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                      <input type="password" id="login-password" autocomplete="off" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                Iniciar Sesión
            </button>
        </form>
         <div class="footer-text">
            <button type="button" class="forgot-password-link" id="open-recovery">¿Olvidaste la contraseña?</button>
         </div>
    </div>
    <div class="recovery-overlay" id="recovery-modal" hidden>
        <section class="recovery-card" role="dialog" aria-modal="true" aria-labelledby="recovery-title">
            <button type="button" class="recovery-close" id="close-recovery" aria-label="Cerrar">×</button>
            <div class="recovery-icon">?</div>
            <h2 id="recovery-title">Recuperar contraseña</h2>
            <p class="recovery-subtitle">Ingresa tu número de documento para solicitar un código de recuperación.</p>
            <form id="recovery-document-form" class="recovery-step">
                <label for="recovery-document">Número de documento</label>
                <input id="recovery-document" type="text" inputmode="numeric" placeholder="Ej. 0003" required>
                <button type="submit" class="btn-submit">Continuar</button>
            </form>
            <form id="recovery-code-form" class="recovery-step" hidden>
                <p class="recovery-notice">Vista previa: se enviará un código único al correo registrado.</p>
                <label for="recovery-code">Código único</label>
                <input id="recovery-code" type="text" inputmode="numeric" maxlength="6" placeholder="Ingresa el código" required>
                <button type="submit" class="btn-submit">Validar código</button>
            </form>
            <form id="recovery-password-form" class="recovery-step" hidden>
                <label for="recovery-new-password">Nueva contraseña</label>
                <input id="recovery-new-password" type="password" placeholder="Crea una nueva contraseña" required>
                <label for="recovery-confirm-password">Confirmar contraseña</label>
                <input id="recovery-confirm-password" type="password" placeholder="Repite la nueva contraseña" required>
                <button type="submit" class="btn-submit">Guardar contraseña</button>
            </form>
            <p class="recovery-feedback" id="recovery-feedback" role="status"></p>
        </section>
    </div>
</body>
</html>
